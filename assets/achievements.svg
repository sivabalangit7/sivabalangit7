<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="hexGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hexGlowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D55" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF2D55" stop-opacity="0"/>
    </radialGradient>
    <polygon id="hex" points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#0B1020" stroke="#00E5FF" stroke-width="1.5"/>
    <polygon id="hexRing" points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="6 6"/>
  </defs>
  <rect x="0" y="0" width="1200" height="220" fill="#05070D"/>
  <rect x="2" y="2" width="1196" height="216" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
  <text x="30" y="30" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="4" fill="#00E5FF">ACHIEVEMENT WALL</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1" fill="#EAFBFF" text-anchor="middle">
    <g transform="translate(120,120)">
      <circle r="45" fill="url(#hexGlowCyan)"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
      <use href="#hexRing"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/></use>
      <use href="#hex"/>
