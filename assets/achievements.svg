      <use href="#hexRing"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/></use>
      <use href="#hex"/>
      <text y="6">XO CODE 26</text>
      <text y="60" fill="#6B7C8F" font-size="9">TOP 15</text>
    </g>
    <g transform="translate(480,120)">
