    <g transform="translate(840,120)">
      <circle r="45" fill="url(#hexGlowCyan)"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <use href="#hexRing"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/></use>
