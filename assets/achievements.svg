      <use href="#hexRing"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></use>
      <use href="#hex"/>
      <text y="6">START UP PARTNER</text>
      <text y="60" fill="#6B7C8F" font-size="9"> PONDICHERRY UNIVERSITY</text>
