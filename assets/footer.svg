<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="fgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F2230" stroke-width="1"/>
    </pattern>
    <linearGradient id="footEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="150" fill="#05070D"/>
  <rect x="0" y="0" width="1200" height="150" fill="url(#fgrid)" opacity="0.3"/>
  <rect x="6" y="6" width="1188" height="138" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.6"/>

  <!-- circuit traces -->
  <g stroke="#7C3AED" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M40,20 L90,20 L90,40 L140,40"/>
    <path d="M1160,20 L1110,20 L1110,40 L1060,40"/>
    <path d="M40,130 L90,130 L90,110 L140,110"/>
    <path d="M1160,130 L1110,130 L1110,110 L1060,110"/>
  </g>

  <!-- scanline -->
  <rect x="6" y="0" width="1188" height="2" fill="#00E5FF" opacity="0.5">
    <animate attributeName="y" values="6;142;6" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="3">
    <text x="600" y="55" font-size="12" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      POWERING DOWN...
    </text>
    <text x="600" y="85" font-size="20" font-weight="bold" fill="#EAFBFF">SYSTEM ONLINE</text>
    <text x="600" y="110" font-size="13" fill="#6B7C8F">BUILD // LEARN // CREATE</text>
    <text x="600" y="132" font-size="10" letter-spacing="4" fill="#FF2D55">END OF TRANSMISSION</text>
  </g>

  <rect x="6" y="148" width="1188" height="2" fill="url(#footEdge)"/>
</svg>
