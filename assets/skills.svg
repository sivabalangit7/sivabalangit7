<!-- HTML -->
<text x="50" y="123"
      fill="#aebbc7"
      font-family="monospace"
      font-size="10">HTML / CSS</text>

<rect x="150" y="114" width="240" height="7" rx="3" fill="#172630"/>
<rect x="150" y="114" width="210" height="7" rx="3"
      fill="url(#cyan)" filter="url(#glow)"/>

<!-- JavaScript -->
<text x="50" y="147"
      fill="#aebbc7"
      font-family="monospace"
      font-size="10">JAVASCRIPT</text>

<rect x="150" y="138" width="240" height="7" rx="3" fill="#172630"/>
<rect x="150" y="138" width="190" height="7" rx="3"
      fill="url(#cyan)"/>

<!-- React -->
