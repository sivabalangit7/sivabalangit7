<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05070d"/>
    <stop offset="100%" stop-color="#0b1620"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00e5ff"/>
    <stop offset="100%" stop-color="#00a8ff"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="900" height="360" rx="18" fill="url(#bg)"/>

<!-- Outer border -->
<rect
  x="2"
  y="2"
  width="896"
  height="356"
  rx="17"
  fill="none"
  stroke="#00e5ff"
  stroke-width="2"
  opacity="0.8"/>

<!-- Header -->
<text
  x="35"
  y="45"
  fill="#00e5ff"
  font-family="monospace"
  font-size="12"
  font-weight="bold"
  letter-spacing="4">
  SKILLS // TECH ARSENAL
</text>

<text
  x="865"
  y="45"
  text-anchor="end"
  fill="#6d7c8c"
  font-family="monospace"
  font-size="9">
  SYSTEM ONLINE
</text>

