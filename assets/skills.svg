<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="330"
     viewBox="0 0 900 330">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#03070b"/>
    <stop offset="100%" stop-color="#08151c"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>
    .title {
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 4px;
      fill: #00e5ff;
    }

    .label {
      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #d9faff;
    }

    .box {
      fill: #071118;
      stroke: #12313a;
      stroke-width: 1;
    }

    .box:hover {
      stroke: #00e5ff;
    }

    .icon {
      fill: none;
      stroke: #00e5ff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

</defs>


<!-- BACKGROUND -->

<rect
  width="900"
  height="330"
  rx="18"
  fill="url(#bg)"
/>


<!-- OUTER FRAME -->

<rect
  x="2"
  y="2"
  width="896"
  height="326"
  rx="17"
  fill="none"
  stroke="#00e5ff"
  stroke-width="2"
  opacity=".8"
/>


<!-- CORNER MARKERS -->

<path d="M18 48V18H48"
      stroke="#00e5ff"
      stroke-width="3"
      fill="none"/>

<path d="M852 18H882V48"
      stroke="#00e5ff"
      stroke-width="3"
      fill="none"/>

<path d="M18 282V312H48"
      stroke="#00e5ff"
      stroke-width="3"
      fill="none"/>

<path d="M852 312H882V282"
      stroke="#00e5ff"
      stroke-width="3"
      fill="none"/>


<!-- HEADER -->

<text
  x="35"
  y="38"
  class="title">
  TECH ARSENAL // SKILLS
</text>

<text
  x="865"
  y="38"
  text-anchor="end"
  font-family="monospace"
  font-size="8"
  fill="#5d7782"
  letter-spacing="2">
  ONLINE
</text>


