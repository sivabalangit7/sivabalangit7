<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="55%" stop-color="#1A0B08"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#0091FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0091FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D55" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF2D55" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF2D55" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A1610" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="300" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#grid)" opacity="0.35"/>

  <!-- outer frame -->
  <rect x="6" y="6" width="1188" height="288" fill="none" stroke="#FFD60A" stroke-width="1.5" opacity="0.7"/>
  <rect x="12" y="12" width="1176" height="276" fill="none" stroke="#FF2D55" stroke-width="1" opacity="0.5"/>

  <!-- corner brackets -->
  <g stroke="#FFD60A" stroke-width="3" fill="none" opacity="0.9">
    <path d="M20,20 L20,50 M20,20 L50,20"/>
    <path d="M1180,20 L1180,50 M1180,20 L1150,20"/>
    <path d="M20,280 L20,250 M20,280 L50,280"/>
    <path d="M1180,280 L1180,250 M1180,280 L1150,280"/>
  </g>

  <!-- animated scanline -->
  <rect x="12" y="0" width="1176" height="3" fill="#FFD60A" opacity="0.5">
    <animate attributeName="y" values="12;285;12" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ARC-CORE emblem, left side -->
  <g transform="translate(140,150)">
    <circle r="70" fill="url(#coreGlow)"/>
    <circle r="46" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.9"/>
    <circle r="34" fill="none" stroke="#0091FF" stroke-width="1.5" opacity="0.8" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="2 4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#EAFBFF">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="92" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="3" fill="#6B7C8F">ARC-CORE</text>
  </g>

  <!-- name / title block -->
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="300" y="130" font-size="42" font-weight="bold" letter-spacing="4" fill="#FFF4D6">SIVA BALAN</text>
    <text x="300" y="160" font-size="16" letter-spacing="6" fill="#FFD60A"> STUDENT // DEVELOPER</text>

    <!-- suit-up sequence loading bar -->
    <text x="300" y="188" font-size="10" letter-spacing="2" fill="#8F6B6B">INITIALIZING DEVELOPER PROTOCOL...</text>
    <rect x="300" y="196" width="420" height="4" fill="#2A1610"/>
    <rect x="300" y="196" height="4" fill="#FF2D55">
      <animate attributeName="width" values="0;420;420;0" keyTimes="0;0.5;0.85;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- status tags -->
    <g font-size="10" letter-spacing="1.5" fill="#8F6B6B">
      <text x="300" y="225">● SYSTEM ONLINE</text>
      <text x="460" y="225" fill="#FFD60A">● DEVELOPER PROTOCOL ACTIVE</text>
      <text x="300" y="245">● MISSION STATUS: ACTIVE</text>
      <text x="460" y="245">● BUILD // LEARN // CREATE</text>
    </g>
  </g>

  <rect x="12" y="270" width="1176" height="2" fill="url(#redEdge)"/>
</svg>
