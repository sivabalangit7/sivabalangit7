<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="repulsor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="380" fill="#05070D"/>
  <rect x="2" y="2" width="1196" height="376" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
  <text x="30" y="30" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="4" fill="#00E5FF">TECH ARSENAL // SYSTEM LOADOUT</text>

  <g font-family="Consolas, 'Courier New', monospace">

    <!-- FRONTEND -->
    <circle cx="30" cy="60" r="30" fill="url(#repulsor)"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <text x="30" y="65" font-size="10" letter-spacing="2" fill="#6B7C8F">FRONTEND</text>
    <g transform="translate(30,80)">
      <g transform="translate(0,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#00E5FF" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" begin="0s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">&lt;/&gt; HTML</text></g>
      <g transform="translate(160,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#00E5FF" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" begin="0.3s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">◆ CSS</text></g>
      <g transform="translate(320,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#00E5FF" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" begin="0.6s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">{ } JAVASCRIPT</text></g>
      <g transform="translate(480,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#00E5FF" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" begin="0.9s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">⚛ REACT</text></g>
    </g>

    <!-- PROGRAMMING -->
    <circle cx="30" cy="140" r="30" fill="url(#repulsor)" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
    <text x="30" y="145" font-size="10" letter-spacing="2" fill="#6B7C8F">PROGRAMMING</text>
    <g transform="translate(30,160)">
      <g transform="translate(0,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#7C3AED" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.2s" begin="0.1s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">🐍 PYTHON</text></g>
      <g transform="translate(160,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#7C3AED" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">C LANG</text></g>
      <g transform="translate(320,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#7C3AED" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.2s" begin="0.7s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">C++</text></g>
    </g>

    <!-- TOOLS -->
    <circle cx="30" cy="220" r="30" fill="url(#repulsor)"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.3s" repeatCount="indefinite"/></circle>
    <text x="30" y="225" font-size="10" letter-spacing="2" fill="#6B7C8F">TOOLS</text>
    <g transform="translate(30,240)">
      <g transform="translate(0,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#00E5FF" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.9s" begin="0s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">⎇ GIT</text></g>
      <g transform="translate(160,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#00E5FF" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.9s" begin="0.35s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">⌥ GITHUB</text></g>
      <g transform="translate(320,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#00E5FF" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.9s" begin="0.7s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">&gt;_ LINUX</text></g>
      <g transform="translate(480,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#00E5FF" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="1.9s" begin="1.05s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">⌘ VS CODE</text></g>
    </g>

    <!-- DEVELOPMENT -->
    <circle cx="30" cy="300" r="30" fill="url(#repulsor)" stroke="none"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
    <text x="30" y="305" font-size="10" letter-spacing="2" fill="#6B7C8F">DEVELOPMENT</text>
    <g transform="translate(30,320)">
      <g transform="translate(0,0)"><rect width="190" height="34" rx="3" fill="#0B1020" stroke="#FF2D55" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.1s" begin="0.2s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">◧ WEB DEVELOPMENT</text></g>
      <g transform="translate(200,0)"><rect width="190" height="34" rx="3" fill="#0B1020" stroke="#FF2D55" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.1s" begin="0.5s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">▣ APP DEVELOPMENT</text></g>
    </g>

    <!-- AI -->
    <circle cx="720" cy="300" r="30" fill="url(#repulsor)"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <text x="720" y="305" font-size="10" letter-spacing="2" fill="#6B7C8F">AI</text>
    <g transform="translate(720,320)">
      <g transform="translate(0,0)"><rect width="150" height="34" rx="3" fill="#0B1020" stroke="#7C3AED" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" begin="0.15s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">✦ AI TOOLS</text></g>
      <g transform="translate(160,0)"><rect width="220" height="34" rx="3" fill="#0B1020" stroke="#7C3AED" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" begin="0.5s" repeatCount="indefinite"/></rect><text x="12" y="22" font-size="12" fill="#EAFBFF">✎ PROMPT ENGINEERING</text></g>
    </g>
  </g>
</svg>
